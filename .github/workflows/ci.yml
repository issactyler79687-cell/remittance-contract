name: Level 3 CI

on:
  push:
    branches:
      - main
      - level-3-upgrade
  pull_request:
    branches:
      - main

jobs:
  smart-contract:
    name: Smart Contract CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run contract tests
        run: cargo test --workspace

      - name: Build contract WASM
        run: cargo build --workspace --target wasm32v1-none --release

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check frontend
        run: npm run type-check

      - name: Build frontend
        run: npm run build

      - name: Run frontend smoke test
        run: npm test

  deployment-config:
    name: Deployment Config Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required files
        shell: bash
        run: |
          test -f README.md
          test -f CONTRACT_ID.txt
          test -f TX_HASH.txt
          test -f DEPLOYMENT.md
          test -f frontend/src/contractConfig.ts
          test -f scripts/deploy-and-save.ps1